name: QuickDeliver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            backend/package-lock.json
      - name: Install admin dependencies
        working-directory: admin-web
        run: npm ci
      - name: Build admin dashboard
        working-directory: admin-web
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check

  flutter-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Customer app dependencies
        working-directory: customer_app
        run: flutter pub get
      - name: Analyze customer app
        working-directory: customer_app
        run: flutter analyze --no-pub
      - name: Delivery app dependencies
        working-directory: delivery_app
        run: flutter pub get
      - name: Analyze delivery app
        working-directory: delivery_app
        run: flutter analyze --no-pub
